<header class="page-header">

  <h1>Book Painting Pixie</h1>

  <p>Quick booking options for parties, events & celebrations</p>

</header>

<section class="booking-grid">

  <!-- Quick contact -->

  <div class="card">

    <h2>📱 Quick Booking</h2>

    <p>Fastest way to check availability:</p>

    <p><strong>Email:</strong> kitkat.83@hotmail.com</p>

    <p><strong>Phone:</strong> 07818 072022</p>

    <a class="whatsapp-btn"

       href="https://wa.me/447818072022?text=Hi%20I'd%20like%20to%20book%20a%20party"

       target="_blank">

      💬 Message on WhatsApp

    </a>

  </div>

  <!-- Form -->

  <div class="card">

    <h2>🗓️ Booking Form</h2>

    <form action="https://formspree.io/f/mjgdnged" method="POST">

      <label for="name">Name</label>
      <input type="text" name="name" placeholder="Your Name" required>

      <label for="email">Email Address</label>
      <input type="email" name="email" placeholder="Email Address" required>

      <label for="phone">Phone</label>
      <input type="tel" name="phone" placeholder="Phone Number" required>

      <label for="date">Event Date</label>
      <input type="date" name="Event Date" required>

      <label for="location">Event Location</label>
      <input type="text" name="location" placeholder="Event Location" required>

      <label for="package">Package</label>

        <select name="package" id="package" required>

          <option value="">Please select a package</option>

          <option value="Classic Party">🎈 Classic Party</option>

          <option value="Ultimate Sparkle">🌟 Ultimate Sparkle</option>

          <option value="Large Event">🎪 Large Event</option>

          <option value="Not Sure Yet">❓ Not Sure Yet</option>

        </select>

      <label for="message">Event Details</label>
      <textarea name="message"

        placeholder="Tell me about your event (ages, number of children, theme etc.)"

        rows="10"></textarea>

      <button type="submit">Send Booking Request</button>

    </form>

  </div>

</section>

<footer>

  © 2026 The Painting Pixie

</footer>

</body>

</html>
